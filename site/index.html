        <div class="reason-card glass" id="reasonCard">

            <p class="reason-eyebrow">Your reason to say no</p>

            <p class="reason-text" id="reasonText" aria-live="polite" aria-label="Generated reason to say no">
                Finding a reason for you...
            </p>

            <div class="card-actions" role="group" aria-label="Reason actions">

                <!-- Regenerate -->
                <button class="action-btn" id="regenerateBtn" title="Regenerate" aria-label="Generate a new reason">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path d="M3 3v5h5" />
                    </svg>
                </button>

                <!-- Share -->
                <button class="action-btn" id="shareBtn" title="Share" aria-label="Share this reason">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                    </svg>
                </button>

                <button class="action-btn star-btn" id="favouriteCardBtn" title="Add to Favourites"
                    aria-label="Toggle favourite" aria-pressed="false">
                    <!-- Outline star (unfavourited) -->
                    <svg class="star-outline" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <polygon
                            points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                    </svg>
                    <!-- Filled star (favourited) -->
                    <svg class="star-filled" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">

                            points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
